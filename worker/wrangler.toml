name = "playready-worker"
main = "src/index.js"
compatibility_date = "2026-03-16"

[vars]
ALLOWED_ORIGIN = "https://songbongs.github.io"
BGG_API_BASE = "https://boardgamegeek.com/xmlapi2"
GEMINI_MODEL = "gemini-2.5-pro"
PDF_EXTRACTOR_URL = "https://playready.onrender.com/extract"
REQUEST_MAX_BYTES = "52428800"
PROCESSING_TIMEOUT_MS = "600000"
BGG_DELAY_MS = "5000"
BGG_MAX_THREADS_PER_FORUM = "9999"
BGG_MAX_COMMENTS_PER_THREAD = "9999"
ENABLE_FACT_PRESERVING_SUMMARY = "true"
ENABLE_STAGE_INPUT_SLICING = "true"
OPTIMIZATION_ROLLOUT_MODE = "safe_only"
OPTIMIZATION_SAFE_PDF_BYTES = "12582912"
OPTIMIZATION_SAFE_MAX_ADDITIONAL_MATERIALS = "0"
OPTIMIZATION_SAFE_MAX_FORUM_THREADS = "12"
OPTIMIZATION_SAFE_MAX_TEXT_BLOCKS = "260"
OPTIMIZATION_SAFE_MAX_PAGES = "80"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "fae3d0e445504158afd0b0cc7ad45ab5"
